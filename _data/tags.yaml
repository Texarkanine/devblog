# Tag descriptions for archive pages.
# Keys must exactly match tag strings used in post/page front matter.
# Values are rendered through kramdown; inline HTML is also supported.
# Use >- for single-paragraph descriptions, | for multi-paragraph.

ai: >-
  Language models and the coding agents around them, as I actually use the
  stuff: harnesses, context, cost, the work.

context-engineering: >-
  What you put in the window, and what you keep out: rules, skills, prompts.
  Horsemanship, once the saddle is on. ([Horses](/garden/ai-horses.html).)

cursor: >-
  Anysphere's AI code editor ([cursor.com](https://cursor.com)). The mouse and
  the SQL kind can sit this one out.

harness-engineering: >-
  The tack: Cursor, Claude Code, the loops and tools you wrap a model in so it
  can do a job. Making saddles. ([Horses](/garden/ai-horses.html).)

jekyll: >-
  The static-site generator this blog runs on. Stevenson already wrote the
  other Jekyll.

mermaid: >-
  [Mermaid](https://mermaid.js.org/) diagrams, baked into pages here at build
  time.

# Tag descriptions for archive pages.
# Keys must exactly match tag strings used in post/page front matter.
# Values are rendered through kramdown; inline HTML is also supported.
# Use >- for single-paragraph descriptions, | for multi-paragraph.

agentic-engineering: >-
  Doing [Software Engineering](/tags/software-engineering) by directing AI agents from increasingly high altitudes.
  [Harness-engineering](/tags/harness-engineering) is the loop they run in; [context-engineering](/tags/context-engineering) is what they can see.

ai: >-
  Language models and the trappings around them, as I actually use the
  stuff: harnesses, context, cost, the work.

context-engineering: >-
  Controlling what information is made available to large language models
  at invocation time — rules files, system prompts, repository knowledge,
  and the architecture of what enters (and stays out of) the context window.

cursor: >-
  Anysphere's AI code editor ([cursor.com](https://cursor.com)).
  The mouse and the SQL kind can sit this one out.

harness-engineering: >-
  Designing the environments, processes, and feedback loops that enable
  AI coding agents to do reliable autonomous work — repository structure,
  context architecture, review workflows, and agent tooling.

jekyll: >-
  The [static-site generator built in Ruby](https://jekyllrb.com/), that this blog runs on.
  Stevenson already wrote the other Jekyll.

mermaid: >-
  [Mermaid](https://mermaid.js.org/) *diagrams*, expressed in markdown to make illustrating concepts
  possible even when authoring "plain" text.
